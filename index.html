<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071421">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="雷霆战机手机版：单指操控，自动射击，穿越星云迎战敌机。">
<title>雷霆战机 · Sky Strike</title>
<link rel="icon" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="home.css">
<script src="home.js" defer></script>
</head>
<body>
<main id="home">
  <header><a class="brand" href="./" aria-label="雷霆战机首页"><span class="brand-icon">✦</span> SKY STRIKE</a><span class="edition">手机畅玩版</span></header>
  <section class="hero">
    <div class="intro"><span class="eyebrow">指尖出击 · 探索深空</span><h1>穿越星海<br><em>火力全开。</em></h1><p class="lead">一根手指，掌控整片星空。<br>驾驶战机，躲避弹幕，迎击下一波敌人。</p></div>
    <div class="hangar" aria-label="全新银翼战机"><div class="orbit"></div><img class="player" src="media/player.webp" width="192" height="192" alt="银白色装甲、蓝色引擎的玩家战机" fetchpriority="high"><img class="enemy" src="media/enemy.webp" width="96" height="96" alt="红色敌方截击机"><span class="ship-tag"><i></i> 银翼 · 待命中</span></div>
    <section class="launch" aria-label="开始游戏">
      <button id="play" class="primary">立即开始 <span>↗</span></button>
      <div class="load-row" role="status" aria-live="polite"><span id="stage">正在准备飞行</span><span id="detail">可以先看看玩法</span></div>
      <div class="track" id="track" aria-hidden="true"><i></i></div>
      <div class="support"><button id="retry" hidden>重新加载</button><button id="install">添加到手机桌面</button><a href="#how">查看玩法 ↓</a></div>
      <p id="notice" class="notice">首次进入需要准备资源，之后会使用手机缓存加速。</p>
    </section>
  </section>
  <section id="how" class="how"><h2>三步，进入战斗</h2><div class="tips"><article><b>01</b><h3>按住拖动</h3><p>手指移动，战机跟随<br>自动开火，专心闪避</p></article><article><b>02</b><h3>收集补给</h3><p>拾取武器与护盾<br>升级你的战斗火力</p></article><article><b>03</b><h3>迎战首领</h3><p>点击屏幕技能按钮<br>在密集弹幕中突围</p></article></div></section>
  <footer>SKY STRIKE <span>无需安装应用 · 竖屏体验更佳</span></footer>
</main>
<div id="game-stage" aria-label="游戏画面"><iframe id="game" title="雷霆战机" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></div>
<noscript>请开启浏览器 JavaScript 后开始游戏。</noscript>
</body></html>
